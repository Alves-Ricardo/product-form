<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Price Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
min-height: 100vh;
padding: 20px;
display: flex;
align-items: center;
justify-content: center;
}

.container {
background: white;
padding: 35px;
border-radius: 16px;
box-shadow: 0 10px 30px rgba(0,0,0,0.2);
max-width: 520px;
width: 100%;
}

h1 {
color: #2d3748;
text-align: center;
margin-bottom: 8px;
font-size: 1.8em;
}

.subtitle {
color: #718096;
text-align: center;
margin-bottom: 25px;
}

.navigation {
display: flex;
gap: 10px;
margin-bottom: 25px;
}

.nav-button {
flex: 1;
padding: 13px 8px;
border: none;
border-radius: 8px;
background: #edf2f7;
color: #4a5568;
font-size: 15px;
font-weight: 600;
cursor: pointer;
}

.nav-button.active.add {
background: #48bb78;
color: white;
}

.nav-button.active.remove {
background: #e53e3e;
color: white;
}

.form-section {
display: none;
}

.form-section.active {
display: block;
}

.section-title {
text-align: center;
font-size: 1.2em;
color: #2d3748;
margin-bottom: 8px;
}

.section-description {
text-align: center;
color: #718096;
margin-bottom: 22px;
font-size: 0.9em;
}

.warning {
background: #fffaf0;
color: #9c4221;
border-left: 4px solid #ed8936;
padding: 12px;
border-radius: 6px;
margin-bottom: 20px;
font-size: 0.9em;
}

.form-group {
margin-bottom: 20px;
}

label {
display: block;
color: #4a5568;
font-weight: 600;
margin-bottom: 8px;
font-size: 0.9em;
}

textarea {
width: 100%;
padding: 14px;
border: 2px solid #e2e8f0;
border-radius: 8px;
font-size: 16px;
font-family: inherit;
min-height: 120px;
resize: vertical;
}

textarea:focus {
outline: none;
border-color: #667eea;
}

.submit-button {
width: 100%;
padding: 14px;
color: white;
border: none;
border-radius: 8px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: background 0.3s;
}

.add-button {
background: #48bb78;
}

.add-button:hover {
background: #38a169;
}

.remove-button {
background: #e53e3e;
}
