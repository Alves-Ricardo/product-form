name: Remove Products from Private Repo

on: issues: types: [opened, reopened]

permissions: issues: write

jobs: remove-products: runs-on: ubuntu-latest

steps:
  - name: Check if removal issue
    id: check
    env:
      TITLE: ${{ github.event.issue.title }}
    run: |
      if [[ "$TITLE" == *"Remove"* && "$TITLE" == *"Product"* ]]; then
        echo "is_remove=true" >> "$GITHUB_OUTPUT"
      else
        echo "is_remove=false" >> "$GITHUB_OUTPUT"
      fi

  - name: Remove products from private repository
    if: steps.check.outputs.is_remove == 'true'
    id: remove
    env:
      TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      REPO: ${{ secrets.PRIVATE_REPO }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    run: |
      python3 <<'PY'
      import os
      import re
      import json
      import base64
      import urllib.request

      token = os.environ["TOKEN"]
      repo = os.environ["REPO"]
      body = os.environ.get("ISSUE_BODY", "")

      if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
          raise ValueError("Invalid PRIVATE_REPO setting")

      owner, repo_name = repo.split("/", 1)

      urls = re.findall(r'https?://[^\s<>]+', body)
      urls = [u.rstrip('.,;:!?)\']}"') for u in urls]
      urls = list(dict.fromkeys(u for u in urls if u))

      if not urls:
          raise ValueError("No product URLs found")

      api_url = (
          f"https://api.github.com/repos/"
          f"{owner}/{repo_name}/contents/products.txt"
      )

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          "User-Agent": "Product-Removal-Workflow"
      }

      def api_request(url, method="GET", data=None):
          request = urllib.request.Request(
              url,
              data=data,
              headers=headers,
              method=method
          )
          with urllib.request.urlopen(request) as response:
              return json.loads(response.read().decode("utf-8"))

      response = api_request(api_url)

      sha = response["sha"]
      current = base64.b64decode(
          response["content"]
      ).decode("utf-8")

      lines = current.splitlines()
      remaining = []
      removed = []

      for line in lines:
          if line.strip() in urls:
              removed.append(line.strip())
          else:
              remaining.append(line)

      if not removed:
          print("No matching products found.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("removed_count=0\n")
              f.write(f"not_found_count={len(urls)}\n")
          raise SystemExit(0)

      updated = "\n".join(remaining)

      if current.endswith("\n") and remaining:
          updated += "\n"

      encoded = base64.b64encode(
          updated.encode("utf-8")
      ).decode("ascii")

      payload = {
          "message": f"Remove {len(removed)} products from tracker",
          "content": encoded,
          "sha": sha
      }

      result = api_request(
          api_url,
          method="PUT",
          data=json.dumps(payload).encode("utf-8")
      )

      if "content" not in result:
          raise RuntimeError("Failed to update products.txt")

      not_found = len(set(urls) - set(removed))

      with open(os.environ["GITHUB_OUTPUT"], "a") as f:
          f.write(f"removed_count={len(removed)}\n")
          f.write(f"not_found_count={not_found}\n")

      print(f"Removed: {len(removed)}")
      print(f"Not found: {not_found}")
      print(f"Remaining: {len(remaining)}")
      PY

  - name: Confirm removal and close issue
    if: steps.check.outputs.is_remove == 'true' && steps.remove.outcome == 'success'
    uses: actions/github-script@v7
    env:
      REMOVED: ${{ steps.remove.outputs.removed_count }}
      NOT_FOUND: ${{ steps.remove.outputs.not_found_count }}
    with:
      script: |
        const removed = Number(process.env.REMOVED || 0);
        const notFound = Number(process.env.NOT_FOUND || 0);

        await github.rest.issues.createComment({
          owner: context.repo.owner,
          repo: context.repo.repo,
          issue_number: context.issue.number,
          body:
            `✅ Product removal completed!\n\n` +
            `Products removed: ${removed}\n` +
            `Products not found: ${notFound}`
        });

        await github.rest.issues.update({
          owner: context.repo.owner,
          repo: context.repo.repo,
          issue_number: context.issue.number,
          state: 'closed'
        });
