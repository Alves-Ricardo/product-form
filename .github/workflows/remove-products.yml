
name: Remove Products from Private Repo

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  remove-products:
    runs-on: ubuntu-latest

    steps:
      # Check issue title
      - name: Check if removal issue
        id: check
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$TITLE" == *"Remove"* && "$TITLE" == *"Product"* ]]; then
            echo "is_remove=true" >> "$GITHUB_OUTPUT"
            echo "This is a Remove Product issue."
          else
            echo "is_remove=false" >> "$GITHUB_OUTPUT"
            echo "Not a Remove Product issue."
          fi

      # Remove products from private repository
      - name: Remove products from private repository
        if: steps.check.outputs.is_remove == 'true'
        id: remove
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          REPO: ${{ secrets.PRIVATE_REPO }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY'
          import os
          import re
          import json
          import base64
          import urllib.request
          import urllib.error

          token = os.environ.get("TOKEN", "")
          repo = os.environ.get("REPO", "")
          body = os.environ.get("ISSUE_BODY", "")

          if not token:
              raise ValueError("PRIVATE_REPO_TOKEN is missing")

          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise ValueError("Invalid PRIVATE_REPO setting.")

          owner, repo_name = repo.split("/", 1)

          # Extract URLs
          urls = re.findall(r'https?://[^\s<>]+', body)
          urls = [u.rstrip('.,;:!?)\']}"') for u in urls]
          urls = list(dict.fromkeys(u for u in urls if u))

          if not urls:
              raise ValueError("No product URLs found in issue.")

          print(f"Found {len(urls)} product URLs.")

          api_url = (
              f"https://api.github.com/repos/"
              f"{owner}/{repo_name}/contents/products.txt"
          )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-API-Version": "2022-11-28",
              "User-Agent": "Product-Removal-Workflow"
          }

          def api_request(url, method="GET", payload=None):
              data = json.dumps(payload).encode() if payload else None

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      return json.loads(response.read().decode())
              except urllib.error.HTTPError as e:
                  details = e.read().decode()
                  raise RuntimeError(
                      f"GitHub API error {e.code}: {details}"
                  )

          # Download current products.txt
          response = api_request(api_url)

          sha = response["sha"]

          current = base64.b64decode(
              response["content"]
          ).decode("utf-8")

          lines = current.splitlines()

          # Remove exact matching URLs
          remaining = []
          removed = []

          for line in lines:
              if line.strip() in urls:
                  removed.append(line.strip())
              else:
                  remaining.append(line)

          not_found = len(set(urls) - set(removed))

          print(f"Products removed: {len(removed)}")
          print(f"Products not found: {not_found}")

          # Export results
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"removed_count={len(removed)}\n")
              f.write(f"not_found_count={not_found}\n")

          if not removed:
              print("No matching products found.")
              raise SystemExit(0)

          # Prepare updated product list
          updated = "\n".join(remaining)

          if current.endswith("\n") and remaining:
              updated += "\n"

          encoded = base64.b64encode(
              updated.encode("utf-8")
          ).decode("ascii")

          payload = {
              "message": f"Remove {len(removed)} products from tracker",
              "content": encoded,
              "sha": sha
          }

          # Update private repository
          result = api_request(
              api_url,
              method="PUT",
              payload=payload
          )

          if "content" not in result:
              raise RuntimeError("Failed to update products.txt")

          print("Product list successfully updated!")
          PY

      # Confirm removal and close issue
      - name: Confirm removal and close issue
        if: steps.remove.outcome == 'success'
        uses: actions/github-script@v7
        env:
          REMOVED: ${{ steps.remove.outputs.removed_count }}
          NOT_FOUND: ${{ steps.remove.outputs.not_found_count }}
        with:
          script: |
            const removed = Number(process.env.REMOVED || 0);
            const notFound = Number(process.env.NOT_FOUND || 0);

            const message =
              `✅ Product removal completed!\n\n` +
              `Products removed: ${removed}\n` +
              `Products not found: ${notFound}\n\n` +
              `The private product tracker has been updated.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
